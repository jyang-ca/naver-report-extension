<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>네이버 증권 리포트 설정</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>네이버 증권 리포트</h1>
      <p class="popup__intro">
        네이버 증권 리서치에 올라온 PDF 리포트를 선택한 날짜 기준으로 자동 다운로드합니다.
        날짜와 섹션별 폴더로 정리해 저장합니다.
      </p>

      <section class="popup__date-section" aria-labelledby="download-date-title">
        <div id="download-date-title" class="popup__section-label">다운로드 날짜</div>
        <div class="popup__quick-dates" role="group" aria-label="빠른 날짜 선택">
          <button type="button" data-date-preset="today">오늘</button>
          <button type="button" data-date-preset="yesterday">어제</button>
          <button type="button" data-date-preset="business-day">최근 영업일</button>
        </div>
        <label class="popup__date-picker">
          <span class="popup__sr-only">다운로드 날짜 선택</span>
          <input id="download-date" type="date" />
        </label>
      </section>

      <div class="popup__action-row">
        <button id="download-today" type="button" class="popup__primary-action">
          <span id="download-today-label" class="popup__primary-date"></span>
          <span id="download-today-action-label" class="popup__primary-subtitle">
            리포트 모두 다운로드
          </span>
        </button>
        <button id="stop-daily-download" type="button" class="popup__stop-action" hidden>
          중단
        </button>
      </div>

      <section id="status-panel" class="popup__status-panel" aria-live="polite">
        <strong id="status-title">대기 중</strong>
        <span id="status-detail">버튼을 누르면 선택한 날짜에 올라온 PDF 리포트를 하나의 ZIP 파일로 저장합니다.</span>
        <div id="status-progress" class="popup__progress" hidden>
          <div class="popup__progress-header">
            <span id="status-progress-count">0 / 0개 완료</span>
            <span id="status-progress-percent">0%</span>
          </div>
          <div class="popup__progress-track" aria-hidden="true">
            <span id="status-progress-bar" class="popup__progress-bar"></span>
          </div>
        </div>
        <span id="status-current-file" class="popup__status-current" hidden></span>
        <span id="status-extra" class="popup__status-extra">PDF 리포트만 다운로드합니다.</span>
      </section>

      <label class="popup__field">
        <span>다운로드 경로</span>
        <div class="popup__path-input">
          <span class="popup__path-prefix">Downloads/</span>
          <input id="download-path-prefix" type="text" />
        </div>
        <small>Chrome 기본 다운로드 폴더 안에 저장됩니다.</small>
        <small id="path-preview" class="popup__example"></small>
        <small id="zip-preview" class="popup__example"></small>
      </label>

      <label class="popup__checkbox">
        <input id="use-native-path-picker" type="checkbox" />
        <span>매번 저장 위치를 직접 선택하기</span>
      </label>

      <label class="popup__checkbox">
        <input id="create-stock-folders" type="checkbox" />
        <span>종목별 폴더 만들기</span>
      </label>

      <section class="popup__field">
        <span>파일명 예시</span>
        <small id="filename-preview" class="popup__example"></small>
      </section>

      <details id="advanced-settings" class="popup__advanced">
        <summary>고급 설정 보기</summary>

        <label class="popup__field">
          <span>파일명 템플릿</span>
          <input id="filename-template" type="text" />
          <small>사용 가능한 항목: 날짜, 종목명, 증권사, 리포트 제목</small>
          <button id="reset-filename-template" type="button" class="popup__secondary-action">
            기본값으로 복원
          </button>
        </label>

        <label class="popup__field">
          <span>리포트 목록 탐색 페이지 수</span>
          <input id="bulk-max-pages" type="number" min="1" max="100" />
          <small>네이버 리서치 목록에서 최대 몇 페이지까지 확인할지 설정합니다.</small>
        </label>

        <label class="popup__field">
          <span>동시 다운로드 수</span>
          <input id="bulk-concurrency" type="number" min="1" max="5" />
          <small>한 번에 몇 개의 PDF를 받을지 설정합니다. 기본값을 권장합니다.</small>
        </label>
      </details>

      <footer class="popup__footer">
        <p id="status-text" class="popup__status">설정을 불러오는 중입니다.</p>
        <a
          class="popup__github-link"
          href="https://github.com/jyang-ca/naver-report-extension"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub 저장소 열기"
          title="GitHub 저장소 열기"
        >
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M8 0.2C3.7 0.2 0.2 3.7 0.2 8c0 3.4 2.2 6.3 5.3 7.4 0.4 0.1 0.5-0.2 0.5-0.4v-1.4c-2.2 0.5-2.6-1-2.6-1-0.4-0.9-0.9-1.1-0.9-1.1-0.7-0.5 0.1-0.5 0.1-0.5 0.8 0.1 1.2 0.8 1.2 0.8 0.7 1.2 1.9 0.9 2.3 0.7 0.1-0.5 0.3-0.9 0.5-1.1-1.7-0.2-3.6-0.9-3.6-3.9 0-0.9 0.3-1.6 0.8-2.1-0.1-0.2-0.3-1 0.1-2.1 0 0 0.7-0.2 2.2 0.8 0.6-0.2 1.3-0.3 2-0.3s1.4 0.1 2 0.3c1.5-1 2.2-0.8 2.2-0.8 0.4 1.1 0.2 1.9 0.1 2.1 0.5 0.6 0.8 1.3 0.8 2.1 0 3-1.8 3.7-3.6 3.9 0.3 0.3 0.5 0.7 0.5 1.5V15c0 0.2 0.1 0.5 0.5 0.4 3.1-1 5.3-4 5.3-7.4 0-4.3-3.5-7.8-7.8-7.8Z"></path>
          </svg>
        </a>
      </footer>
    </main>

    <script src="utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
