name: Build and release extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      zip_name: ${{ steps.bundle.outputs.zip_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest_version=$(node -p "require('./manifest.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "manifest.json version ($manifest_version) does not match tag ($tag_version)." >&2
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build extension package
        run: npm run build

      - name: Resolve bundle name
        id: bundle
        run: |
          zip_name=$(find dist -maxdepth 1 -type f -name 'naver-report-extension-v*.zip' -print | head -n 1 | xargs basename)
          if [ -z "$zip_name" ]; then
            echo "Built ZIP file was not found." >&2
            exit 1
          fi
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: dist/${{ steps.bundle.outputs.zip_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-package
          path: dist

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip_path="dist/${{ needs.build.outputs.zip_name }}"
          if [ ! -f "$zip_path" ]; then
            echo "Release asset not found: $zip_path" >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "$zip_path" \
            --title "$GITHUB_REF_NAME" \
            --notes "Chrome extension package built from $GITHUB_SHA."
